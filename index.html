<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task List</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind custom theme: blue primary, orange accent -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50:  '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            accent: {
              50:  '#fff7ed',
              100: '#ffedd5',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
            },
          },
          fontFamily: {
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            card: '0 2px 12px rgba(0, 0, 0, 0.07)',
            'card-hover': '0 4px 20px rgba(59, 130, 246, 0.12)',
          },
        },
      },
    };
  </script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Custom stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-gray-50 font-sans text-gray-800 min-h-screen antialiased">

  <!-- ╔══════════════════════════════════════╗
       ║            HEADER / NAV             ║
       ╚══════════════════════════════════════╝ -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">

      <!-- Brand -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-primary-600 flex items-center justify-center shadow-sm">
          <!-- Clipboard-check icon -->
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor"
               stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7
                 a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2
                 M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">
          Task<span class="text-primary-600">List</span>
        </h1>
      </div>

      <!-- Header action: Clear completed -->
      <button
        id="btn-clear-completed"
        class="hidden sm:inline-flex items-center gap-2 text-sm font-medium
               text-gray-500 hover:text-red-500 px-3 py-2 rounded-xl
               hover:bg-red-50 transition-all duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862
               a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6
               m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        Clear Completed
      </button>

    </div>
  </header>

  <!-- ╔══════════════════════════════════════╗
       ║               MAIN                  ║
       ╚══════════════════════════════════════╝ -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 space-y-6">

    <!-- ── Add Task Form ── -->
    <section class="bg-white rounded-2xl shadow-card border border-gray-100 p-5 sm:p-6">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-widest mb-4">
        New Task
      </h2>

      <form id="form-add-task" novalidate>
        <!-- Task title input + submit button -->
        <div class="flex gap-2 sm:gap-3">
          <input
            id="input-task-title"
            type="text"
            placeholder="What needs to be done?"
            maxlength="120"
            autocomplete="off"
            class="task-input flex-1"
            aria-label="New task title"
          />
          <button type="submit" class="btn-primary" aria-label="Add task">
            <svg class="w-4 h-4" fill="none" stroke="currentColor"
                 stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            <span class="hidden sm:inline">Add Task</span>
          </button>
        </div>

        <!-- Inline validation error -->
        <p id="error-empty-title"
           class="hidden mt-2 text-xs font-medium text-red-500"
           role="alert">
          Please enter a task title.
        </p>
      </form>
    </section>

    <!-- ── Filters (counts injected by script.js) ── -->
    <div class="flex items-center gap-2"
         role="tablist"
         aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all"       role="tab">All</button>
      <button class="filter-btn"        data-filter="active"    role="tab">Active</button>
      <button class="filter-btn"        data-filter="completed" role="tab">Completed</button>
    </div>

    <!-- ── Task List ── -->
    <section aria-label="Task list">
      <!-- Task items injected by script.js -->
      <ul id="task-list" class="space-y-3" aria-live="polite" aria-relevant="additions removals"></ul>

      <!-- Empty state (shown when no tasks match filter) -->
      <div id="empty-state" class="hidden">
        <div class="flex flex-col items-center justify-center py-16 text-center">
          <div class="w-16 h-16 rounded-2xl bg-primary-50 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-primary-300" fill="none" stroke="currentColor"
                 stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7
                   a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2
                   M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
          </div>
          <p id="empty-state-msg" class="text-gray-500 font-medium"></p>
          <p class="text-gray-400 text-sm mt-1">Add a task above to get started.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ╔══════════════════════════════════════╗
       ║            EDIT MODAL               ║
       ╚══════════════════════════════════════╝ -->
  <div id="edit-modal"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-title"
       class="modal-backdrop hidden">
    <div class="modal-panel">

      <!-- Modal header -->
      <div class="flex items-center justify-between mb-5">
        <h3 id="modal-title" class="text-lg font-bold text-gray-800">Edit Task</h3>
        <button id="btn-modal-close"
          aria-label="Close modal"
          class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Modal form fields -->
      <div class="space-y-4">
        <label class="block">
          <span class="field-label">Title <span class="text-red-400">*</span></span>
          <input id="edit-task-title" type="text" maxlength="120"
            class="task-input mt-1 w-full" />
        </label>
        <label class="block">
          <span class="field-label">Notes <span class="font-normal text-gray-400">(optional)</span></span>
          <textarea id="edit-task-notes" rows="3" maxlength="300"
            placeholder="Add extra details…"
            class="task-input mt-1 w-full resize-none"></textarea>
        </label>
      </div>

      <!-- Modal actions -->
      <div class="flex justify-end gap-3 mt-6">
        <button id="btn-modal-cancel" class="btn-ghost">Cancel</button>
        <button id="btn-modal-save"   class="btn-primary">Save Changes</button>
      </div>

    </div>
  </div>

  <!-- ╔══════════════════════════════════════╗
       ║           TOAST CONTAINER           ║
       ╚══════════════════════════════════════╝ -->
  <div id="toast-container"
       class="fixed bottom-5 right-4 sm:right-6 z-50 flex flex-col items-end gap-2 pointer-events-none"
       aria-live="assertive"
       aria-atomic="true">
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
